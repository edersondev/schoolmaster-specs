post:
  tags:
    - Users
  summary: Apply one lifecycle action to selected users
  description: |
    Requires an active school context. User restore actions require both
    school-scoped users.view and users.manage; other lifecycle actions require
    school-scoped users.lifecycle. Platform-owned users are outside this bulk
    endpoint.
  operationId: bulkLifecycleUsers
  x-system-administrator-master-access: true
  parameters:
    - $ref: ../../components/parameters/schools/TenantContext.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/users/UserBulkLifecycleActionRequest.yaml
  responses:
    '200':
      description: Bulk user lifecycle action completed
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../components/schemas/common/SuccessEnvelope.yaml
              - type: object
                properties:
                  data:
                    $ref: ../../components/schemas/common/BulkLifecycleOutcome.yaml
    '401':
      $ref: ../../components/responses/auth/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/common/AdministrationForbidden.yaml
    '409':
      $ref: ../../components/responses/common/Conflict.yaml
    '422':
      $ref: ../../components/responses/common/ValidationError.yaml
