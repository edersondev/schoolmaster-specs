post:
  tags:
    - Account Lifecycle
  summary: Request password setup or reset delivery for an active user
  description: >-
    Explicitly submits one single-use password setup or reset link by email for
    an eligible active user. The server derives setup versus reset from the
    target's credential state. School tenant context and actor authority are
    resolved before target lookup. Missing, inactive, mismatched, or
    unauthorized tenant context returns tenant_mismatch. A successful response
    means the configured mail transport accepted the submission; it does not
    confirm inbox delivery. No token, URL, password, email address, or provider
    diagnostic is returned. A newer accepted delivery supersedes older active
    reset links. Mail failure leaves no newly usable link. Delivery is limited
    to three accepted requests per user and scope in 24 hours, and active
    reset-token completion suppression blocks issuance.
  operationId: requestUserPasswordDelivery
  x-system-administrator-master-access: true
  parameters:
    - $ref: ../../components/parameters/schools/TenantContext.yaml
    - $ref: ../../components/parameters/users/UserId.yaml
  responses:
    '201':
      description: Password delivery request accepted by the mail transport
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../components/schemas/common/SuccessEnvelope.yaml
              - type: object
                properties:
                  data:
                    $ref: ../../components/schemas/account-lifecycle/PasswordDeliveryRequestResult.yaml
    '401':
      $ref: ../../components/responses/auth/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/account-lifecycle/AccountLifecycleForbidden.yaml
    '404':
      $ref: ../../components/responses/common/NotFound.yaml
    '409':
      $ref: ../../components/responses/common/Conflict.yaml
    '422':
      $ref: ../../components/responses/common/ValidationError.yaml
    '429':
      $ref: ../../components/responses/account-lifecycle/PasswordDeliveryRateLimited.yaml
    '503':
      $ref: ../../components/responses/account-lifecycle/PasswordDeliveryUnavailable.yaml
