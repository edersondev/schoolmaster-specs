type: object
required:
  - id
  - school_id
  - full_name
  - relationship_type
  - status
properties:
  id:
    type: string
    format: uuid
    description: Guardian record UUID associated with the student profile.
  school_id:
    type: string
    format: uuid
  full_name:
    type: string
  relationship_type:
    type: string
    description: Relationship label stored on this student-guardian association.
  contact_email:
    type:
      - string
      - 'null'
    format: email
  contact_phone:
    type:
      - string
      - 'null'
  status:
    $ref: ../common/Status.yaml
