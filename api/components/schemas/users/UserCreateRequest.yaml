type: object
additionalProperties: false
required:
  - full_name
  - email
  - role_ids
properties:
  account_setup_mode:
    type: string
    description: >-
      Controls initial account state. Omitted or active preserves active-user
      creation. Invitation persists an invited user without creating an
      invitation, lifecycle token, or delivery request.
    enum:
      - active
      - invitation
    default: active
  school_id:
    type: string
    format: uuid
  full_name:
    type: string
  email:
    type: string
    format: email
  role_ids:
    type: array
    items:
      type: string
      format: uuid
