type: object
additionalProperties: false
required:
  - invitation_token
  - password
properties:
  invitation_token:
    type: string
    minLength: 1
    maxLength: 255
    description: >-
      Single-use invitation secret copied from the email URL fragment. Clients
      must submit it only in this JSON body, never in a request path or query.
  password:
    type: string
    minLength: 12
    maxLength: 128
    description: >-
      Passwords shorter than 12 characters, longer than 128 characters, or found
      in the common-password blocklist are rejected. Paste and password managers
      must be allowed by clients.
